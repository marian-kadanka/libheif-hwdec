# Builds the binary packages for every supported distribution, each in a container of that
# distribution, with packaging/ci/build-package.sh. On a push or pull request the packages are
# kept as workflow artifacts; on a tag v<version> they are also attached to the GitHub release of
# that tag. The GitHub runners have no GPU, so only the unit tests run.

name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: 'docker.io/library/ubuntu:24.04' }
          - { distro: ubuntu-26.04, image: 'docker.io/library/ubuntu:26.04' }
          - { distro: debian-13, image: 'docker.io/library/debian:13' }
          - { distro: debian-testing, image: 'docker.io/library/debian:testing' }
          - { distro: fedora-44, image: 'registry.fedoraproject.org/fedora:44' }
          - { distro: opensuse-tumbleweed, image: 'registry.opensuse.org/opensuse/tumbleweed:latest' }
          - { distro: arch, image: 'docker.io/library/archlinux:latest' }
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout needs git in the container to check out a real repository.
      - name: Install git
        run: |
          if command -v apt-get > /dev/null; then apt-get update -qq && apt-get install -y -qq git ca-certificates
          elif command -v dnf > /dev/null; then dnf -y -q install git
          elif command -v zypper > /dev/null; then zypper -n -q install git tar gzip
          elif command -v pacman > /dev/null; then pacman -Sy --noconfirm --needed git
          fi
      - uses: actions/checkout@v4
      - name: Build package
        run: packaging/ci/build-package.sh "${{ matrix.distro }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
